name: Deploy Backend to HostAfrica

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Only trigger if files in backend folder change

jobs:
  web-deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: da27.host-ww.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Always use ./ prefix for local-dir to avoid path resolution errors
        local-dir: ./backend/
        # Use absolute path or ./ prefix for server-dir, ensuring it ends in a trailing slash
        server-dir: domains/api.sokomtaa.co.ke/public_html/laravel_app/
        state-name: .ftp-deploy-sync-state.json
        port: 21
        timeout: 300000 # 5 minutes
        # Some servers require this for explicit TLS/SSL
        security: loose
        # Exclude files you don't want to overwrite in production using proper glob patterns
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/storage/**
          **/tests/**
          **/.env*
          **/vendor/**
          **/bootstrap/cache/**
