# Soko Mtaa — Nginx Reverse Proxy
#
# Routing:
#   /ws/*        → Go Gateway (port 8002)  — WebSocket with upgrade headers
#   /go/health   → Go Gateway /health      — load balancer probe
#   /api/*       → Laravel API (port 8000) — REST/HTTPS
#   /            → Laravel API (port 8000) — default fallback
#
# FastAPI (port 8001) is intentionally NOT routed here.
# It is accessible only from within the Docker network (Laravel → FastAPI).

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ── Upstream definitions ──────────────────────────────────────────────
    upstream laravel {
        server laravel:8000;
    }

    upstream go_gateway {
        server go_gateway:8002;
    }

    # ── Main server block ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------------
        # WebSocket — Go Gateway
        # Matches /ws/ and any sub-path (e.g. /ws/rider?rider_id=…&token=…)
        # ------------------------------------------------------------------
        location /ws/ {
            proxy_pass         http://go_gateway;
            proxy_http_version 1.1;

            # Required WebSocket upgrade headers
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Keep WebSocket connections open for up to 1 hour
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ------------------------------------------------------------------
        # Go Gateway health probe
        # Used by load balancers / uptime monitors without hitting the WS port
        # Proxied as GET /go/health → Go Gateway /health
        # ------------------------------------------------------------------
        location = /go/health {
            proxy_pass         http://go_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_read_timeout 5s;
        }

        # ------------------------------------------------------------------
        # Laravel REST API
        # Matches /api/ and any sub-path
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://laravel;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 10s;

            # Forward client body for POST/PUT requests
            proxy_request_buffering off;
        }

        # ------------------------------------------------------------------
        # Default — also forward to Laravel (handles /auth/*, /internal/*, etc.)
        # ------------------------------------------------------------------
        location / {
            proxy_pass         http://laravel;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
        }
    }
}
